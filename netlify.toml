# Netlify: builds and serves the React app in web/.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under
# Site configuration -> Environment variables (public browser values only).
[build]
  base    = "web"
  # keep-live-apk: a build made by Netlify itself keeps the Android app that is live (the GitHub workflow does this on its own).
  command = "(npm ci || npm install) && npm run build && bash ../scripts/keep-live-apk.sh dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# No preview site for pull requests (owner, 22 Nov 2026): it used Netlify's build minutes.
# "exit 0" tells Netlify to skip the build. The live site (main) is not affected.
[context.deploy-preview]
  ignore = "exit 0"

# Single-page app: every route (/staff/login, /app/...) is served by index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app asks these to find out whether an update is live: never keep an old copy.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/download/*"
  [headers.values]
    Cache-Control = "no-cache"
