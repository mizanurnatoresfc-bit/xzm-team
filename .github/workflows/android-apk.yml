# Web changes deploy from main. Manual runs build a signed Android APK for testing.
# The publish input also replaces the APK download on the live site when run on main.
name: Android APK and site build

on:
  workflow_dispatch:
    inputs:
      publish_apk:
        description: Publish the tested Android release to the live website
        type: boolean
        default: false
      replace_legacy_168:
        description: First signed release only. Users on debug build 168 must reinstall
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk
  queue: max

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: 21

      - name: Check settings
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Repository variables win; otherwise web/.env.production (public values) is used.
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env.production.local
          elif [ ! -f .env.production ]; then
            echo "::error::No Supabase settings: add web/.env.production or repository variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          if grep -qE 'sb_secret|service_role' .env.production* 2>/dev/null; then echo "::error::A SECRET key was found. Use the publishable key only."; exit 1; fi

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Build the app pages
        run: npm run build

      # The reader of the courier panel's "Update Report" text (pure functions, no browser).
      - name: Report parser tests
        run: npm run test:parser

      # Opens the built pages in a real browser (PC and phone size, database answers faked).
      # If a screen is broken the run stops here and the live website is left as it was.
      - name: Smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:smoke

      - name: Prepare Android project
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Configure GOOGLE_SERVICES_JSON for the Android release."
            exit 1
          fi
          if [ ! -d android ]; then npx cap add android; fi
          npx -y @capacitor/assets generate --android || echo "icons skipped"
          npx cap sync android
          node <<'NODE'
          const fs = require('node:fs');
          const appId = require('./capacitor.config.json').appId;
          const config = JSON.parse(process.env.GOOGLE_SERVICES_JSON);
          if (!config.client?.some(client => client.client_info?.android_client_info?.package_name === appId)) {
            throw new Error('Firebase config must contain the Android application ID ' + appId);
          }
          fs.writeFileSync('android/app/google-services.json', process.env.GOOGLE_SERVICES_JSON);
          NODE
          manifest=android/app/src/main/AndroidManifest.xml
          for permission in POST_NOTIFICATIONS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            grep -q "android.permission.$permission" "$manifest" ||
              sed -i "/<application/i\    <uses-permission android:name=\"android.permission.$permission\" />" "$manifest"
          done
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build and sign Android release
        if: github.event_name == 'workflow_dispatch'
        working-directory: web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for setting in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing Android release signing setting: $setting"
              exit 1
            fi
          done
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/xzm-signing.XXXXXX")"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset KEYSTORE_BASE64
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          build_tools="$(dirname "$apksigner")"
          "$build_tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/xzm-aligned.apk"
          apk="$GITHUB_WORKSPACE/XZM-TEAM.apk"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/xzm-aligned.apk"
          "$apksigner" verify --print-certs "$apk"
          permissions="$("$build_tools/aapt" dump permissions "$apk")"
          for permission in POST_NOTIFICATIONS ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            grep -Fq "android.permission.$permission" <<< "$permissions"
          done
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/xzm-apk-badging.txt"
          grep -F "versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/xzm-apk-badging.txt"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: XZM-TEAM-apk
          path: XZM-TEAM.apk
          retention-days: 30

      # The download the app offers: this run's APK, or (on an ordinary push) the one already live, kept as it is.
      - name: App download
        env:
          PUBLISH_APK: ${{ inputs.publish_apk }}
          REPLACE_LEGACY: ${{ inputs.replace_legacy_168 }}
        run: |
          mkdir -p dist/download
          if [ "$REPLACE_LEGACY" = "true" ] && { [ "$PUBLISH_APK" != "true" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; }; then
            echo "::error::The build 168 replacement requires publication from main."
            exit 1
          fi
          if [ "$PUBLISH_APK" = "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            legacy_build=168
            live_apk="$RUNNER_TEMP/xzm-live.apk"
            status="$(curl -sSL --retry 2 --connect-timeout 15 --max-time 60 -o "$live_apk" -w '%{http_code}' https://xzmteam.com/download/XZM-TEAM.apk)"
            if [ "$status" = 200 ]; then
              apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
              test -x "$apksigner"
              signer_digests() {
                "$apksigner" verify --print-certs "$1" > "$RUNNER_TEMP/xzm-apk-certs.txt" || return 1
                awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print $NF }' "$RUNNER_TEMP/xzm-apk-certs.txt" | sort
              }
              live_signers="$(signer_digests "$live_apk")"
              build_signers="$(signer_digests "$GITHUB_WORKSPACE/XZM-TEAM.apk")"
              if [ -z "$live_signers" ] || [ -z "$build_signers" ]; then
                echo "::error::Could not read both APK signing certificates."
                exit 1
              fi
              live_badging="$("$(dirname "$apksigner")/aapt" dump badging "$live_apk")"
              live_build="$(sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$live_badging")"
              if [ -z "$live_build" ] || [ "$GITHUB_RUN_NUMBER" -le "$live_build" ]; then
                echo "::error::The Android release must have a higher versionCode than the published APK."
                exit 1
              fi
              if [ "$REPLACE_LEGACY" = "true" ]; then
                if [ "$live_build" != "$legacy_build" ] || [ "$live_signers" = "$build_signers" ] ||
                  ! grep -Fq "package: name='com.xzmteam.erp' " <<< "$live_badging"; then
                  echo "::error::The one-time replacement applies only to the published XZM TEAM debug build 168."
                  exit 1
                fi
              elif [ "$live_signers" != "$build_signers" ]; then
                echo "::error::The APK signer differs from the published APK. Use the established signing key."
                exit 1
              fi
            elif [ "$status" != 404 ] || [ "$REPLACE_LEGACY" = "true" ]; then
              echo "::error::Could not check the published APK (HTTP $status)."
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/XZM-TEAM.apk" dist/download/XZM-TEAM.apk
            printf '{"build":%s,"version":"1.%s","url":"/download/XZM-TEAM.apk","at":"%s","reinstallThrough":%s}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" "$legacy_build" > dist/download/apk.json
          else
            ok=0
            if curl -fsSL https://xzmteam.com/download/apk.json -o /tmp/apk.json && node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/apk.json','utf8')); if(!(j.build>0)) process.exit(1)" \
               && curl -fsSL https://xzmteam.com/download/XZM-TEAM.apk -o /tmp/app.apk && [ "$(head -c 2 /tmp/app.apk)" = "PK" ]; then ok=1; fi
            if [ "$ok" = 1 ]; then cp /tmp/apk.json dist/download/apk.json; cp /tmp/app.apk dist/download/XZM-TEAM.apk; echo "kept the live APK"; else echo "no APK published yet"; fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: web/dist
          retention-days: 30

      # Uploads the finished pages straight to Netlify. Netlify runs no build of its own,
      # so this does not use Netlify build minutes/credits.
      # One-time setup: Netlify -> User settings -> Applications -> New access token,
      # then GitHub -> repo Settings -> Secrets and variables -> Actions -> New repository
      # secret named NETLIFY_AUTH_TOKEN. Without the secret this step is skipped.
      - name: Publish the website to Netlify
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_apk)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 2909a0bd-55bc-4b11-930f-73750fb34bd4
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::notice::No NETLIFY_AUTH_TOKEN secret, so the website was not published. Download the site-dist artifact and drop it on Netlify instead."
            exit 0
          fi
          # --no-build: upload dist exactly as made above. Without it the CLI reads netlify.toml, runs the build again and drops dist/download (the APK).
          npx -y netlify-cli@latest deploy --prod --no-build --dir dist --site "$NETLIFY_SITE_ID" --message "GitHub build ${GITHUB_SHA:0:7}"
