# Builds the Android app (APK) on GitHub's servers - no Android Studio needed on the PC.
# Push = website only (fast). The APK is built only by hand: Actions -> this workflow -> Run workflow.
# Runs on every push that changes the app, or by hand: Actions -> "Android APK" -> Run workflow.
# Download: open the finished run -> "Artifacts" -> XZM-TEAM-apk (a zip with XZM-TEAM.apk inside).
#
# Supabase settings come from web/.env.production (public values). Repository variables
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY, if set, take precedence.
name: Android APK and site build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: 21

      - name: Check settings
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Repository variables win; otherwise web/.env.production (public values) is used.
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env.production.local
          elif [ ! -f .env.production ]; then
            echo "::error::No Supabase settings: add web/.env.production or repository variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          if grep -qE 'sb_secret|service_role' .env.production* 2>/dev/null; then echo "::error::A SECRET key was found. Use the publishable key only."; exit 1; fi

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Build the app pages
        run: npm run build

      # Opens the built pages in a real browser (PC and phone size, database answers faked).
      # If a screen is broken the run stops here and the live website is left as it was.
      - name: Smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:smoke

      # The Android app loads the live site, so page updates reach it without a new APK; the app offers "আপডেট করুন".
      # A new APK is needed only when something on the phone side changes. It is built by hand (Run workflow),
      # numbered with the run number, and published with the site under /download/, where the app finds it.
      - name: Android project
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Without the Firebase file the push plugin is left out, so the app never calls Firebase uninitialised (that would crash it).
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then npm uninstall --no-audit --no-fund @capacitor/push-notifications; fi
          if [ ! -d android ]; then npx cap add android; fi
          npx -y @capacitor/assets generate --android || echo "icons skipped"
          npx cap sync android
          # Phone push: the Firebase file comes from the repository secret GOOGLE_SERVICES_JSON (set once by the owner).
          # Without it the app builds as before, just without push.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" || { echo "::error::GOOGLE_SERVICES_JSON is not valid JSON"; exit 1; }
            echo "push: Firebase file added"
          else
            echo "push: no GOOGLE_SERVICES_JSON secret — building without push"
          fi
          # Android 13+: the app must declare that it may show notifications.
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          # the app's version: build number = this run, shown as 1.<run>
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/XZM-TEAM.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: XZM-TEAM-apk
          path: XZM-TEAM.apk
          retention-days: 30

      # The download the app offers: this run's APK, or (on an ordinary push) the one already live, kept as it is.
      - name: App download
        run: |
          mkdir -p dist/download
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cp "$GITHUB_WORKSPACE/XZM-TEAM.apk" dist/download/XZM-TEAM.apk
            printf '{"build":%s,"version":"1.%s","url":"/download/XZM-TEAM.apk","at":"%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" > dist/download/apk.json
          else
            ok=0
            if curl -fsSL https://xzmteam.com/download/apk.json -o /tmp/apk.json && node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/apk.json','utf8')); if(!(j.build>0)) process.exit(1)" \
               && curl -fsSL https://xzmteam.com/download/XZM-TEAM.apk -o /tmp/app.apk && [ "$(head -c 2 /tmp/app.apk)" = "PK" ]; then ok=1; fi
            if [ "$ok" = 1 ]; then cp /tmp/apk.json dist/download/apk.json; cp /tmp/app.apk dist/download/XZM-TEAM.apk; echo "kept the live APK"; else echo "no APK published yet"; fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: web/dist
          retention-days: 30

      # Uploads the finished pages straight to Netlify. Netlify runs no build of its own,
      # so this does not use Netlify build minutes/credits.
      # One-time setup: Netlify -> User settings -> Applications -> New access token,
      # then GitHub -> repo Settings -> Secrets and variables -> Actions -> New repository
      # secret named NETLIFY_AUTH_TOKEN. Without the secret this step is skipped.
      - name: Publish the website to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 2909a0bd-55bc-4b11-930f-73750fb34bd4
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::notice::No NETLIFY_AUTH_TOKEN secret, so the website was not published. Download the site-dist artifact and drop it on Netlify instead."
            exit 0
          fi
          # --no-build: upload dist exactly as made above. Without it the CLI reads netlify.toml, runs the build again and drops dist/download (the APK).
          npx -y netlify-cli@latest deploy --prod --no-build --dir dist --site "$NETLIFY_SITE_ID" --message "GitHub build ${GITHUB_SHA:0:7}"
