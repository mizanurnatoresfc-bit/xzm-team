# Builds the Staging database (project xzm-team-staging) from the repository. Manual run only.
# Needs the repository secret STAGING_DB_URL (Staging project's database connection string, Session pooler).
# The script refuses to run against the live project or against a Staging database that already has tables.
name: Staging database bootstrap

on:
  workflow_dispatch:
  # TEMPORARY: GitHub only allows a manual run of a workflow that is on the default branch. This lets the branch itself
  # run it once, when this file is pushed. Remove this block after the first successful Staging build.
  push:
    branches: [claude/festive-wright-rl98et]
    paths: ['.github/workflows/staging-bootstrap.yml']

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build Staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: bash scripts/system-control/staging-bootstrap.sh
