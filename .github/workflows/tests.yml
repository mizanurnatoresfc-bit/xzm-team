# Database check: every migration in order on a throwaway PostgreSQL 16, then all SQL tests (scripts/test-db.sh).
# Runs once per change (pull request, or a push to main) and only when database files changed, to save Actions minutes:
# a branch push is not tested twice, and a change to documents or to the website alone does not start it.
# The website has its own check in website.yml. Nothing here touches the live Supabase project; no secrets are used.
name: Tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/test-db.sh'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/test-db.sh'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migrations and SQL tests
        run: bash scripts/test-db.sh
