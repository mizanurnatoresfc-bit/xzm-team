<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803D" />
    <meta name="description" content="XZM-TEAM Employee and Management ERP" />
    <title>XZM-TEAM ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <script>try{var t=localStorage.getItem('xzm_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);var l=localStorage.getItem('xzm_lang');if(l==='en')document.documentElement.lang='en';var d=document.documentElement,x=localStorage.getItem('xzm_text');if(x==='l'||x==='xl'||x==='xxl')d.setAttribute('data-text',x);if(localStorage.getItem('xzm_contrast')==='more')d.setAttribute('data-contrast','more');if(localStorage.getItem('xzm_motion')==='reduce')d.setAttribute('data-motion','reduce')}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
