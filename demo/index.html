<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XZM-TEAM ERP Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* Layout idea: finance-grade app shell — fixed green sidebar, scope bar, card grid; tables collapse to record cards on phones. */
:root{
  --primary:#0F7A3D; --primary-dark:#0A4D27; --primary-50:#E8F5EE;
  --canvas:#F4F7F5; --surface:#FFFFFF; --text:#0F172A; --muted:#475569; --border:#DDE5E0;
  --ok-fg:#166534; --ok-bg:#DCFCE7; --warn-fg:#92400E; --warn-bg:#FEF3C7;
  --bad-fg:#B91C1C; --bad-bg:#FEE2E2; --info-fg:#1D4ED8; --info-bg:#DBEAFE;
  --side:#FFFFFF; --side-fg:#1F2937; --side-muted:#6B7280;
  --font-body:"Inter","Hind Siliguri",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:"Hind Siliguri","Inter",system-ui,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(10,77,39,.06),0 1px 1px rgba(15,23,42,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#34A86A; --primary-dark:#0B3A20; --primary-50:#143826;
  --canvas:#0D1512; --surface:#15201B; --text:#E6EEE9; --muted:#A5B6AD; --border:#2A3832;
  --ok-fg:#86EFAC; --ok-bg:#14361F; --warn-fg:#FCD34D; --warn-bg:#3A2B0B;
  --bad-fg:#FCA5A5; --bad-bg:#3B1414; --info-fg:#93C5FD; --info-bg:#132544;
  --side:#111A16; --side-fg:#DDE7E1; --side-muted:#8FA59A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --primary:#34A86A; --primary-dark:#0B3A20; --primary-50:#143826;
  --canvas:#0D1512; --surface:#15201B; --text:#E6EEE9; --muted:#A5B6AD; --border:#2A3832;
  --ok-fg:#86EFAC; --ok-bg:#14361F; --warn-fg:#FCD34D; --warn-bg:#3A2B0B;
  --bad-fg:#FCA5A5; --bad-bg:#3B1414; --info-fg:#93C5FD; --info-bg:#132544;
  --side:#111A16; --side-fg:#DDE7E1; --side-muted:#8FA59A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--text);font:15px/1.5 var(--font-body)}
html[lang="bn"] body{line-height:1.65}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.demo-ribbon{background:var(--warn-bg);color:var(--warn-fg);font-size:13px;padding:6px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.demo-ribbon b{font-weight:700}
.demo-ribbon .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo-ribbon select,.demo-ribbon button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:13px;cursor:pointer}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:var(--bad-fg);border-color:var(--bad-fg)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px}
.field .err{color:var(--bad-fg);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
@media (max-width:560px){.grid2,.grid4{grid-template-columns:1fr}}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)} .b-warn{background:var(--warn-bg);color:var(--warn-fg)}
.b-bad{background:var(--bad-bg);color:var(--bad-fg)} .b-info{background:var(--info-bg);color:var(--info-fg)}
.b-neutral{background:var(--canvas);color:var(--muted);border:1px solid var(--border)}
.count{background:var(--warn-bg);color:var(--warn-fg);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:auto}

/* public site */
.pub-head{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;font-size:18px;color:inherit;text-decoration:none}
.mark{width:34px;height:34px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:800}
.pub-head nav{display:flex;gap:18px;margin-left:auto;align-items:center;flex-wrap:wrap}
.pub-head nav a{color:var(--text);text-decoration:none;font-weight:500}
.hero{padding:56px 24px 40px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:38px;color:var(--primary-dark)}
:root[data-theme="dark"] .hero h1{color:var(--text)}
.hero p{font-size:17px;color:var(--muted);max-width:60ch}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.feat{max-width:1100px;margin:0 auto;padding:12px 24px 48px}
.feat .grid3 .card h3{color:var(--primary)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pub-foot{border-top:1px solid var(--border);padding:20px 24px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:32px}.hero h1{font-size:30px}.steps3{grid-template-columns:1fr}}

/* login */
.login-wrap{min-height:calc(100% - 34px);display:grid;place-items:center;padding:24px}
.login{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.login.admin{border-top:4px solid var(--primary-dark)}

/* app shell */
.app{display:grid;grid-template-columns:264px 1fr;min-height:calc(100% - 34px)}
.side{background:var(--side);color:var(--side-fg);padding:14px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side{border-right:1px solid var(--border)}
.side .logo{color:var(--side-fg);padding:4px 8px 12px}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.side a{display:flex;align-items:center;gap:10px;color:var(--side-fg);text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px}
.side a:hover{background:var(--canvas)}
.side a.on{background:var(--primary-50);color:var(--primary);font-weight:600}
.side-user{display:flex;gap:10px;align-items:center;padding:4px 8px 10px;min-width:0}
.side-user b{display:block;font-size:13px;text-transform:uppercase;line-height:1.25;overflow-wrap:anywhere}
.side-search{border:1px solid var(--border);background:var(--canvas);border-radius:8px;padding:8px 10px;min-height:36px;margin:0 2px 4px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--canvas);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap}
.pill:hover{border-color:var(--primary)}
.pill.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.list-search{border:1px solid var(--border);border-radius:999px;padding:8px 14px;background:var(--surface);flex:1;min-width:200px;max-width:320px;min-height:38px}
.list-filter{border:1px solid var(--border);border-radius:999px;padding:6px 12px;background:var(--surface);min-height:38px;font-size:13px}
table.people th{background:var(--canvas)}
table.people td{vertical-align:middle}
table.people .acts-cell{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:1100px){.top .pill{display:none}}
.si{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;vertical-align:-3px;flex:none;display:inline-block}
h1 .si{width:24px;height:24px;color:var(--primary)} h3 .si{color:var(--primary)} .badge .si{width:13px;height:13px;vertical-align:-2px}
table.plain th{white-space:normal;background:var(--canvas)} table.plain td{vertical-align:middle}
@media (max-width:560px){table.plain th,table.plain td{padding:8px 6px;font-size:13px}}
.sheet{container-type:inline-size;background:#fff;color:#111;width:100%;max-width:794px;aspect-ratio:210/297;margin:0 auto;border:1px solid var(--border);background-size:100% 100%;background-repeat:no-repeat;overflow:hidden;box-sizing:border-box}
.sheet .in{padding-left:10%;padding-right:10%;font:1.75cqw/1.6 Georgia,"Times New Roman","Hind Siliguri",serif}
.sheet h2,.sheet h4{font-family:inherit;color:#111}
#docPrint{display:none}
@media print{
  body.print-doc>*:not(#docPrint){display:none!important}
  body.print-doc #docPrint{display:block}
  body.print-doc .sheet{width:210mm;height:297mm;max-width:none;border:none;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.side svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top .search{flex:1;max-width:420px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--canvas)}
.top .spacer{flex:1}
.iconbtn{position:relative;border:1px solid var(--border);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--bad-fg);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;font-weight:700}
.menu-btn{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-50);color:var(--primary-dark);display:grid;place-items:center;font-weight:700;font-size:13px}
:root[data-theme="dark"] .avatar{color:var(--text)}
.scopebar{background:var(--primary-50);border-bottom:1px solid var(--border);padding:8px 20px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.page{padding:22px 20px 60px;max-width:1440px;width:100%;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;gap:12px;justify-content:space-between;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card>h3{margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--primary)}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:500}
.stat .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.alert{border-left:4px solid var(--warn-fg)}
.note{background:var(--info-bg);color:var(--info-fg);border-radius:8px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.bad{background:var(--bad-bg);color:var(--bad-fg)}

/* tables -> cards on phones */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
td.r,th.r{text-align:right}
tr.hl td{background:var(--warn-bg)}
.sec{display:block;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards tr{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:var(--surface)}
  table.cards td{border:none;padding:6px 10px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.cards td::before{content:attr(data-l);font-size:12px;color:var(--muted);text-align:left;font-weight:600}
  table.cards td.r{text-align:right}
}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.step{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.step .dotn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;border:2px solid var(--border);background:var(--surface);color:var(--muted)}
.step.done .dotn{background:var(--primary);border-color:var(--primary);color:#fff}
.step.cur .dotn{border-color:var(--primary);color:var(--primary)}
@media (max-width:760px){.stepper{grid-template-columns:1fr}}

/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;border-bottom:1px solid var(--border);background:repeating-linear-gradient(to top,transparent 0 37px,var(--border) 37px 38px)}
.bars div{flex:1;background:var(--primary);border-radius:6px 6px 0 0;position:relative;min-width:18px;opacity:.85}
.bars div:last-child{opacity:1}
.bars span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.bar-l{display:flex;gap:10px;font-size:11px;color:var(--muted)} .bar-l span{flex:1;text-align:center;min-width:18px}
.meter{height:8px;border-radius:999px;background:var(--canvas);border:1px solid var(--border);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(8,20,14,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.item.unread{border-left:4px solid var(--primary)}
.mobilebar{display:none}
@media (max-width:1023px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .top .search{display:none}
}
@media (max-width:640px){
  .page{padding:16px 16px 90px}
  .mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .mobilebar a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);text-decoration:none;gap:2px;min-width:64px;padding:4px}
  .mobilebar a.on{color:var(--primary);font-weight:700}
  .mobilebar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
  .top{padding:8px 12px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.list-tools{margin:0 0 8px;align-items:center;gap:6px}
tr.marked>td{background:color-mix(in srgb,var(--primary) 10%,transparent)}
#printBox{display:none}
@media print{
  body.print-list>*:not(#printBox){display:none!important}
  body.print-list #printBox{display:block}
  .demo-ribbon,.side,.top,.scopebar,.mobilebar,.no-print,.toast,.modal-bg{display:none!important}
  .app{display:block}.page{padding:0;max-width:none}.card{box-shadow:none;border:none;padding:0}
  body{background:#fff;color:#000;font-size:11px}.tbl-wrap{overflow:visible}th,td{padding:5px 6px}
}
/* ===== v2: icon tools, grouped sidebar, role badges ===== */
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:9px;cursor:pointer;color:var(--muted);transition:background .12s,color .12s,border-color .12s}
.ibtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-50)}
.ibtn .si{width:17px;height:17px;vertical-align:0}
.ibtn.pdf:hover{color:var(--bad-fg);border-color:var(--bad-fg);background:var(--bad-bg)}
.ibtn.xl:hover{color:var(--ok-fg);border-color:var(--ok-fg);background:var(--ok-bg)}
.ibtn.danger{color:var(--bad-fg)} .ibtn.danger:hover{background:var(--bad-bg);border-color:var(--bad-fg)}
.lt-grp{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--border);border-radius:11px;background:var(--canvas)}
.lt-grp .ibtn{border-color:transparent;background:transparent;width:32px;height:32px}
.lt-grp .ibtn:hover{background:var(--surface);border-color:var(--border)}
.list-tools{gap:10px}
.more{position:relative;display:inline-block}
.mmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:5px;display:flex;flex-direction:column}
.mmenu[hidden]{display:none}
.mmenu button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:14px}
.mmenu button:hover{background:var(--primary-50);color:var(--primary)}
/* grouped sidebar */
.ngrp{display:flex;flex-direction:column}
.ngh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-fg);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;text-align:left}
.ngh:hover{background:var(--canvas)}
.ngh>span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ngh .gi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary);flex:none}
.ngh .gi svg{width:16px;height:16px}
.ngh .gi{position:relative}.gdot{position:absolute;top:-6px;right:-7px;background:var(--warn-fg);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.ngh .chev{margin-left:auto;transition:transform .15s;color:var(--side-muted)}
.ngh .chev svg{width:14px;height:14px}

function confirmBox(title,body,needReason,onOk,okLabel="Confirm"){

  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector("#mc").onclick=close;bg.onclick=e=>{if(e.target===bg)close()};
  bg.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

}

const marks={};
function enhanceLists(){
  const title=(document.querySelector(".ph h1")||{}).textContent||"List";
  const acts=document.querySelector(".page .ph > .row:last-child");
  if(acts){const pb=document.createElement("button");pb.type="button";pb.className="ibtn no-print";pb.title=pb.ariaLabel=L("Print page","পেজ প্রিন্ট");pb.innerHTML=si("print");pb.onclick=()=>{log("PRINT",title,"page","whole page");window.print()};acts.appendChild(pb)}
  document.querySelectorAll(".page table").forEach((tb,ti)=>{
    const head=tb.tHead&&tb.tHead.rows[0];if(!head||tb.closest("td")||tb.hasAttribute("data-notools"))return;
    const bodyRows=[...tb.tBodies].flatMap(x=>[...x.rows]);
    const rows=bodyRows.filter(r=>!r.querySelector("td[colspan]"));
    bodyRows.forEach(r=>{const c=r.querySelector("td[colspan]");if(c)c.colSpan+=2});
    const key=screen+"#"+ti;if(!marks[key]||marks[key].n!==rows.length)marks[key]={n:rows.length,set:new Set()};const mk=marks[key].set;
    [...head.children].forEach((th,i)=>{if(!th.textContent.trim()){th.classList.add("no-print");rows.forEach(r=>r.children[i]&&r.children[i].classList.add("no-print"))}});
    head.insertAdjacentHTML("afterbegin",`<th class="no-print" style="width:28px"><input type="checkbox" aria-label="Mark all rows" data-mall></th><th style="width:44px">S/L</th>`);
    rows.forEach((r,i)=>{r.insertAdjacentHTML("afterbegin",`<td data-l="Mark" class="no-print"><input type="checkbox" aria-label="Mark row ${i+1}" data-mk="${i}"></td><td data-l="S/L" class="num">${i+1}</td>`);r.firstElementChild.addEventListener("click",e=>e.stopPropagation())});
    if(tb.tFoot)[...tb.tFoot.rows].forEach(r=>r.insertAdjacentHTML("afterbegin",`<td class="no-print"></td><td></td>`));
    const bar=document.createElement("div");bar.className="row no-print list-tools";
    const ib=(a,icn,en,bn,cls="")=>`<button type="button" class="ibtn ${cls}" data-a="${a}" title="${L(en,bn)}" aria-label="${L(en,bn)}">${si(icn)}</button>`;
    bar.innerHTML=`<span class="lt-grp">${ib("all","checkall","Mark all","সব চিহ্নিত")}${ib("none","uncheck","Unmark all","চিহ্ন মুছুন")}</span><span class="small muted" data-cnt></span><span style="flex:1"></span><span class="lt-grp">${ib("data","print","Print","প্রিন্ট")}${ib("pdf","pdf","Download PDF","PDF ডাউনলোড","pdf")}${ib("xl","xls","Download Excel","Excel ডাউনলোড","xl")}<span class="more">${ib("more","dots","More options","আরও অপশন")}<span class="mmenu" hidden><button type="button" data-a="page">${si("print")}${L("Print whole page","পুরো পেজ প্রিন্ট")}</button><button type="button" data-a="csv">${si("file")}${L("Download CSV","CSV ডাউনলোড")}</button><button type="button" data-a="copy">${si("copy")}${L("Copy rows","সারি কপি")}</button></span></span></span>`;
    const host=tb.closest(".tbl-wrap")||tb;host.parentNode.insertBefore(bar,host);
    const sync=()=>{bar.querySelector("[data-cnt]").textContent=L(`${rows.length} rows · ${mk.size} marked`,`${bnNum(rows.length)}টি সারি · ${bnNum(mk.size)}টি চিহ্নিত`);rows.forEach((r,i)=>{r.classList.toggle("marked",mk.has(i));r.querySelector("[data-mk]").checked=mk.has(i)});head.querySelector("[data-mall]").checked=rows.length>0&&mk.size===rows.length};
    tb.addEventListener("change",e=>{const c=e.target;if(c.dataset.mk!==undefined){c.checked?mk.add(+c.dataset.mk):mk.delete(+c.dataset.mk)}else if(c.dataset.mall!==undefined){mk.clear();if(c.checked)rows.forEach((_,i)=>mk.add(i))}else return;sync()});
    const scopeTxt=n=>`${n} row${n===1?"":"s"}${mk.size?" (marked only)":""}`;
    bar.onclick=e=>{const btn=e.target.closest("[data-a]");if(!btn)return;const a=btn.dataset.a;const mm=bar.querySelector(".mmenu");
      if(a==="more"){mm.hidden=!mm.hidden;if(!mm.hidden)setTimeout(()=>document.addEventListener("click",function f(ev){if(!ev.target.closest(".more")){mm.hidden=true}document.removeEventListener("click",f)}),0);return}
      mm.hidden=true;
      if(a==="csv"||a==="copy"){const keep=[...head.children].map((_,i)=>i).filter(i=>i>0&&head.children[i].textContent.trim());const txt=td=>{const s=td.querySelector("select");return (s?s.value:td.innerText).replace(/\s+/g," ").trim()};
        const data=rows.map((r,i)=>[r,i]).filter(([r,i])=>!mk.size||mk.has(i)).map(([r,i])=>keep.map(c=>c===1?i+1:txt(r.children[c])));if(!data.length){toast(L("There are no rows","কোনো সারি নেই"));return}
        const hd=keep.map(i=>head.children[i].textContent.trim());
        if(a==="csv"){const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;zDownload(new Blob(["\ufeff"+[hd,...data].map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}),`XZM-TEAM-${screen}-list${ti+1}.csv`);log("EXPORT",title,"list "+(ti+1),"CSV · "+scopeTxt(data.length));toast(L("CSV downloaded","CSV ডাউনলোড হয়েছে"))}
        else{const tx=[hd,...data].map(r=>r.join("\t")).join("\n");(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>toast(L(`${data.length} rows copied`,`${bnNum(data.length)}টি সারি কপি হয়েছে`)),()=>toast(L("Copy is blocked here","এখানে কপি করা যাচ্ছে না")))}
        return}
      if(a==="pdf"){const old=document.title;document.title=`XZM-TEAM-${title}`;toast(L("In the print window choose “Save as PDF”","প্রিন্ট উইন্ডোতে “Save as PDF” বেছে নিন"));addEventListener("afterprint",function f(){document.title=old;removeEventListener("afterprint",f)});setTimeout(()=>bar.querySelector('[data-a="data"]').click(),350);return}
      if(a==="all"){rows.forEach((_,i)=>mk.add(i));sync()}
      else if(a==="none"){mk.clear();sync()}
      else if(a==="page"){log("PRINT",title,"page","whole page");window.print()}
      else if(a==="data"){const n=mk.size||rows.length;if(!n){toast("There are no rows to print");return}
        const cl=tb.cloneNode(true);cl.querySelectorAll(".no-print").forEach(x=>x.remove());[...cl.tBodies].flatMap(x=>[...x.rows]).filter(r=>!r.querySelector("td[colspan]")).forEach((r,i)=>{if(mk.size&&!mk.has(i))r.remove()});
        const box=document.createElement("div");box.id="printBox";box.innerHTML=`<h2 style="margin:0 0 2px">XZM-TEAM — ${esc(title)}</h2><p style="margin:0 0 10px">${scopeTxt(n)} · printed ${now()} by ${esc(me())}</p>`;box.appendChild(cl);
        document.body.appendChild(box);document.body.classList.add("print-list");
        const done=()=>{box.remove();document.body.classList.remove("print-list");removeEventListener("afterprint",done)};addEventListener("afterprint",done);
        log("PRINT",title,"list "+(ti+1),scopeTxt(n));window.print()}
      else if(a==="xl"){const keep=[...head.children].map((_,i)=>i).filter(i=>i>0&&head.children[i].textContent.trim());
        const txt=td=>{const s=td.querySelector("select");return (s?s.value:td.innerText).replace(/\s+/g," ").trim()};
        const data=rows.map((r,i)=>[r,i]).filter(([r,i])=>!mk.size||mk.has(i)).map(([r,i])=>keep.map(c=>c===1?i+1:txt(r.children[c])));
        if(!data.length){toast("There are no rows to export");return}
        const blob=zXlsx("XZM-TEAM — "+title,`${scopeTxt(data.length)} · exported ${now()} by ${me()}`,keep.map(i=>head.children[i].textContent.trim()),data);
        const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=`XZM-TEAM-${screen}-list${ti+1}.xlsx`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),2000);
        log("EXPORT",title,"list "+(ti+1),"Excel · "+scopeTxt(data.length));toast(`Excel file downloaded · ${scopeTxt(data.length)}`)}};
    sync();
  });
}
function bindCommon(){
  const rs=document.getElementById("roleSel");
  if(rs) rs.onchange=e=>{role=e.target.value;store.set("role",role);toast(`Now viewing as ${roles[role].name}`);if(APP_SCREENS.includes(screen.replace("denied:",""))&&!perms[role].includes(screen.replace("denied:",""))){go("dash")}else route()};
  document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"bn":"en";store.set("lang",lang);render()};

function empCols(){const canSens=role==="super";const mask=s=>"•••• •••• "+s.slice(-4);const deptShown=()=>empVisibleKeys().includes("dept");

   {k:"name",l:"Employee",fixed:true,c:e=>`<a href="#profile" data-prof="${e.id}" style="color:inherit;text-decoration:none"><b>${esc(e.name)}</b></a><span class="sec num">ID ${e.id}${deptShown()?"":" · "+esc(e.dept)}</span>`},

   {k:"join",l:"Joined",num:1,c:e=>dmy(e.join)},

   {k:"missing",l:"Missing information",c:e=>e.missing.length?e.missing.map(m=>`<span class="badge b-warn">${esc(m)}</span>`).join(" "):'<span class="muted">—</span>'}];

  const custom=customFields.filter(f=>!f.archived&&f.visible).map(f=>({k:"f:"+f.code,l:f.label,custom:true,num:f.type==="number",c:e=>{const v=(customValues[e.id]||{})[f.code];const shown=v==null||v===""?'<span class="muted">—</span>':esc(f.type==="date"&&/^\d{4}-\d\d-\d\d$/.test(v)?dmy(v):Array.isArray(v)?v.join(", "):v);

  return [...base,...custom]}
function empVisibleKeys(){let v=null;try{v=JSON.parse(store.get("empcols","null"))}catch(e){}return Array.isArray(v)&&v.length?v:EMP_DEF}

  if(tab==="Daily cash count")body=`<table class="cards"><tbody>${[["Opening balance (last approved count)",cashDay.opening],["+ Rider handovers received",cashDay.riderIn],["+ Cash taken at the hub counter",cashDay.counter],["− Sent to Main Accounts",-cashDay.toAccounts],["− Merchant payments in cash",-cashDay.merchant],["− Approved hub expenses",-cashDay.expenses]].map(([l,v])=>`<tr><td>${l}</td><td class="r num">${fmt(v)}</td></tr>`).join("")}<tr><td><b>Expected cash in hand</b></td><td class="r num"><b>${fmt(expected)}</b></td></tr></tbody></table>
   ${cashDay.status?`<div class="note ${cashDay.counted!==expected?"warn":""}" style="margin-top:12px">Counted ${fmt(cashDay.counted)} · difference <b>${fmt(cashDay.counted-expected)}</b>${cashDay.note?" · "+esc(cashDay.note):""}. ${badge("Submitted")} A second person approves it; the next day opens with the counted amount.</div>`
   :`<form class="row" id="ccf" style="margin-top:12px"><div class="field"><label for="ccn">Cash counted (৳)</label><input id="ccn" type="number" min="0" step="0.01" required></div><div class="field" style="flex:1;min-width:200px"><label for="cct">Note (required if there is a difference)</label><input id="cct"></div><button class="btn primary" style="align-self:flex-end">Submit count</button></form>`}`;

    const diff=d.col!==d.exp;confirmBox(`Approve ${d.id}?`,diff?`COD collected ${fmt(d.col)} differs from COD expected ${fmt(d.exp)}. A reason is required.`:`${d.parcel} · ${d.outcome}. The parcel is closed and ${fmt(d.col)} is added to the rider's cash.`,diff,r=>{d.status="Approved";log("APPROVE","Delivery",d.id,`${d.outcome} ${fmt(d.col)}${r?" — "+r:""}`);toast(`${d.id} approved`);render()},"Approve")});
  document.querySelectorAll("[data-dr]").forEach(b=>b.onclick=()=>{const d=deliveries.find(x=>x.id===b.dataset.dr);confirmBox(`Reject ${d.id}?`,"The parcel stays with the rider and a new record is made. This record stays in history.",true,r=>{d.status="Rejected";log("REJECT","Delivery",d.id,"reason: "+r);toast(`${d.id} rejected`);render()},"Reject")});

};

 ${handovers.map(h=>`<div class="card"><div class="card-head"><div><h3>${h.id} · <span class="num">${fmt(h.amount)}</span></h3><span class="muted small">${dmy(h.date)} · ${esc(h.from)} → ${esc(h.to)}</span></div>${h.step>=5?badge("Reconciled"):`<button class="btn primary sm" data-hs="${h.id}">${["","","Verify as receiver","Approve (Accounts)","Reconcile"][h.step]}</button>`}</div>
  <div class="stepper" style="--n:5">${handoverSteps.map((l,i)=>`<div class="step ${i<h.step?"done":i===h.step?"cur":""}"><span class="dotn">${i<h.step?"✓":i+1}</span><span>${l}</span></div>`).join("")}</div>

/* ---------- accounts ---------- */
VIEWS.accounts=()=>{const L=ui.jLines;const dr=L.reduce((a,l)=>a+(+l[1]||0),0),cr=L.reduce((a,l)=>a+(+l[2]||0),0);const bal=dr===cr&&dr>0;const tb=coa.map(([c,n])=>{let d=0,k=0;journals.filter(j=>j.status==="Posted"||j.status==="Reversed").forEach(j=>j.lines.forEach(l=>{if(l[0]===c){d+=l[1];k+=l[2]}}));return [c,n,d,k]}).filter(r=>r[2]||r[3]);const tD=tb.reduce((a,r)=>a+r[2],0),tC=tb.reduce((a,r)=>a+r[3],0);

    <td class="r"><input aria-label="Debit line ${i+1}" class="num" data-li="${i}" data-k="1" type="number" min="0" step="0.01" value="${l[1]||""}" style="width:130px;text-align:right;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--surface)"></td>
    <td class="r"><input aria-label="Credit line ${i+1}" class="num" data-li="${i}" data-k="2" type="number" min="0" step="0.01" value="${l[2]||""}" style="width:130px;text-align:right;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--surface)"></td>
    <td>${L.length>2?`<button type="button" class="btn sm" data-rm="${i}" aria-label="Remove line ${i+1}">✕</button>`:""}</td></tr>`).join("")}

BIND.accounts=()=>{
  const recalc=()=>{const L=ui.jLines;const dr=L.reduce((a,l)=>a+(+l[1]||0),0),cr=L.reduce((a,l)=>a+(+l[2]||0),0);const bal=Math.round(dr*100)===Math.round(cr*100)&&dr>0;document.getElementById("tdr").textContent=fmt(dr);document.getElementById("tcr").textContent=fmt(cr);const m=document.getElementById("balmsg");m.className="badge "+(bal?"b-ok":dr===0&&cr===0?"b-neutral":"b-bad");m.textContent=bal?"Balanced":dr===0&&cr===0?"Enter amounts":"Not balanced: difference "+fmt(Math.abs(dr-cr));document.getElementById("jsub").disabled=!bal};

  document.getElementById("jf").onsubmit=e=>{e.preventDefault();if(!ui.jDesc.trim()){toast("Description is required");return}const ref="JV-2611-00"+(14+journals.length);journals.unshift({ref,date:"2026-11-11",desc:ui.jDesc,status:"Pending Approval",maker:me(),checker:"",lines:ui.jLines.filter(l=>l[1]||l[2]).map(l=>[...l])});log("CREATE","Accounts",ref,"journal submitted for approval");ui.jLines=[["5220",0,0],["1110",0,0]];ui.jDesc="";toast(`${ref} sent for approval`);render()};
  document.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>{const j=journals.find(x=>x.ref===b.dataset.post);if(j.maker===me()){confirmBox("Maker cannot approve","You created this entry. A different authorised person must approve and post it (maker–checker control).",false,()=>{},"OK");return}j.status="Posted";j.checker=me();log("POST","Accounts",j.ref,"approved and posted");toast(`${j.ref} posted`);render()});

};

function zHubPerf(days,offset=0){const per=Z_DAYS.slice(Z_DAYS.length-days-offset,Z_DAYS.length-offset);
  const rows=hubs.filter(h=>inScope(h.id)).map(h=>{const all=hubDaily.filter(r=>r.hub===h.id&&per.includes(r.date));const v=all.filter(r=>r.status==="Verified");const s=k=>v.reduce((a,r)=>a+r[k],0);const last=v[v.length-1]||{};const rd=s("riders");

function zStatDefs(){const es=employees.filter(e=>inScope(e.hub));const row=e=>({id:e.id,name:e.name,pos:e.pos,hub:e.hub,status:e.status,date:e.join,note:""});

   ["resigned","Resigned","since "+dmy(Z_FROM),es.filter(e=>e.status==="Resigned").map(e=>ev(e,"Resignation"))],

function zCompletion(){const rf=customFields.filter(f=>f.required&&!f.archived);const total=Z_REQ.length+rf.length;
  return employees.filter(e=>inScope(e.hub)&&["Active","Transferred"].includes(e.status)).map(e=>{const miss=[...e.missing,...rf.filter(f=>(customValues[e.id]||{})[f.code]==null).map(f=>f.label)];return {e,miss,total,pct:Math.round((total-miss.length)/total*1000)/10}}).sort((a,b)=>a.pct-b.pct)}
function zPlan(days){const perf=zHubPerf(days).filter(r=>r.h.status==="active");const prev=days===7?zHubPerf(7,7):[];
  const m=perf.map(r=>{const wl=r.days?(r.pk+r.dl)/r.days:0,dlv=r.days?r.dl/r.days:0;const need=r.days>=Z_SET.minDays?Math.ceil((wl+r.pend/Z_SET.clear)/Z_SET.ppr):null;const p=prev.find(x=>x.h.id===r.h.id);const pwl=p&&p.days>=Z_SET.minDays?(p.pk+p.dl)/p.days:null;
    return {r,wl,dlv,need,gap:need===null?null:need-Math.round(r.riders),used:r.cap?wl/r.cap*100:null,bdays:dlv?r.pend/dlv:null,trend:pwl?(wl-pwl)/pwl*100:null}});
  return m.map(x=>{const n=x.r.h.name;const spare=m.find(y=>y!==x&&y.gap!==null&&y.gap<=-2&&y.r.h.zone===x.r.h.zone);let kind,sum;
    if(x.r.days<Z_SET.minDays){kind="data_gap";sum=`${n} has only ${x.r.days} verified day(s) of figures in this period; at least ${Z_SET.minDays} are needed. No recommendation is made.`}
    else if(x.gap>=1&&(x.used>100||x.bdays>Z_SET.alert)){
      if(spare){kind="rebalance_riders";sum=`${n} needs about ${x.need} riders for its workload but has ${zNum(x.r.riders)} on duty on average. ${spare.r.h.name} appears to have spare riders: review a temporary reallocation before considering recruitment.`}
      else{kind="add_riders";sum=`${n} needs about ${x.need} riders for its workload and backlog but has ${zNum(x.r.riders)} on duty on average. Consider requesting ${x.gap} additional rider(s); HR and management decide.`}}
    else if(x.bdays>Z_SET.alert){kind="review_backlog";sum=`${n} holds ${zNum(x.r.pend)} pending parcels, about ${zNum(x.bdays)} day(s) of deliveries. Rider numbers look sufficient: review routing, attendance and failed deliveries.`}
    else if(x.r.hours>Z_SET.maxh){kind="review_overtime";sum=`Riders at ${n} average ${zNum(x.r.hours)} hours per day, above the ${Z_SET.maxh}-hour guide. Review shifts and workload distribution.`}

  if(/visit|travel|fuel|km|kilomet|claim|meal|transport/.test(s)){const v=zVisits.filter(x=>inScope(x.hub)&&x.date>=Z_DAYS[14-d]);const sum=k=>v.reduce((a,x)=>a+x[k],0);

  if(/pickup|deliver|volume|best|top|compare|performance|cash|expense/.test(s))return {lines:perf.map(x=>`#${x.rank} ${x.h.name}: ${zNum(x.pk)} pickups, ${zNum(x.dl)} deliveries, ${zNum(x.perRider)} parcels per rider-day, cash ${fmt(x.cash)}, expenses ${fmt(x.exp)}`),src:`Verified daily hub figures, last ${d} days`};

const zCrcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const zCrc=b=>{let c=-1;for(let i=0;i<b.length;i++)c=zCrcT[(c^b[i])&255]^(c>>>8);return (c^-1)>>>0};
function zZip(files,type){const enc=new TextEncoder();const parts=[],cen=[];let off=0;const u16=n=>[n&255,n>>>8&255],u32=n=>[n&255,n>>>8&255,n>>>16&255,n>>>24&255];
  files.forEach(([name,text])=>{const nb=enc.encode(name),data=enc.encode(text),crc=zCrc(data);
    const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)];
    parts.push(new Uint8Array([...u32(0x04034b50),...common]),nb,data);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=30+nb.length+data.length});
  const cs=cen.reduce((a,b)=>a+b.length,0);
  return new Blob([...parts,...cen,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)])],{type})}
function zXlsx(title,sub,cols,rows,plain){const x=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));const ns="http://schemas.openxmlformats.org/spreadsheetml/2006/main",pk="http://schemas.openxmlformats.org/package/2006",od="http://schemas.openxmlformats.org/officeDocument/2006/relationships",hd='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const cell=(v,b)=>typeof v==="number"&&isFinite(v)?`<c${b?' s="1"':""}><v>${v}</v></c>`:`<c t="inlineStr"${b?' s="1"':""}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
  const all=plain?[cols,...rows]:[[title],[sub],cols,...rows];const hr=plain?0:2;
  return zZip([
   ["[Content_Types].xml",`${hd}<Types xmlns="${pk}/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
   ["_rels/.rels",`${hd}<Relationships xmlns="${pk}/relationships"><Relationship Id="rId1" Type="${od}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ["xl/workbook.xml",`${hd}<workbook xmlns="${ns}" xmlns:r="${od}"><sheets><sheet name="Report" sheetId="1" r:id="rId1"/></sheets></workbook>`],
   ["xl/_rels/workbook.xml.rels",`${hd}<Relationships xmlns="${pk}/relationships"><Relationship Id="rId1" Type="${od}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${od}/styles" Target="styles.xml"/></Relationships>`],
   ["xl/styles.xml",`${hd}<styleSheet xmlns="${ns}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`],
   ["xl/worksheets/sheet1.xml",`${hd}<worksheet xmlns="${ns}"><cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${i?16:28}" customWidth="1"/>`).join("")}</cols><sheetData>${all.map((r,i)=>`<row r="${i+1}">${r.map(v=>cell(v,i===0||i===hr)).join("")}</row>`).join("")}</sheetData></worksheet>`]
  ],"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}

function zReport(kind){const scope=roles[role].scope.type==="global"?"All zones":roles[role].name;const data=hubDaily.filter(r=>inScope(r.hub)&&r.status==="Verified");
  const agg=(keyFn,labelFn)=>{const g={};data.forEach(r=>{const k=keyFn(r);(g[k]=g[k]||{label:labelFn(r),pk:0,dl:0,cash:0,exp:0,pend:0,n:0,days:new Set()});const o=g[k];o.pk+=r.pk;o.dl+=r.dl;o.cash+=r.cash;o.exp+=r.exp;o.pend+=r.pend;o.n++;o.days.add(r.date)});
    return Object.keys(g).sort().map(k=>[g[k].label,g[k].days.size,g[k].pk,g[k].dl,g[k].cash,g[k].exp,Math.round(g[k].pend/g[k].n)])};
  const opsCols=[["","t"],["Days","n"],["Pickups","n"],["Deliveries","n"],["Cash collected","m"],["Expenses","m"],["Avg pending","n"]];const withFirst=(c,l)=>[[l,"t"],...c.slice(1)];
  const es=employees.filter(e=>inScope(e.hub));
  const wf=(keyFn)=>{const g={};es.forEach(e=>{const k=keyFn(e);const o=g[k]=g[k]||[k,0,0,0,0,0];if(!["Resigned","Archived"].includes(e.status))o[1]++;if(["Active","Transferred"].includes(e.status))o[2]++;if(e.join>=Z_FROM)o[3]++;if(e.status==="Resigned")o[4]++;if(e.status==="Transferred")o[5]++});return Object.keys(g).sort().map(k=>g[k])};
  const wfCols=l=>[[l,"t"],["Headcount","n"],["Active","n"],["New joining","n"],["Resigned","n"],["Transferred","n"]];
  const span=`${dmy(Z_DAYS[0])} – ${dmy(Z_DAYS[13])}`;
  const R={
   "Weekly":()=>({cols:withFirst(opsCols,"Week"),rows:agg(r=>zWeek(r.date),r=>"Week of "+dmy(zWeek(r.date))),sub:`Operations by week · ${span}`}),
   "Monthly":()=>({cols:withFirst(opsCols,"Month"),rows:agg(r=>r.date.slice(0,7),r=>new Date(r.date+"T00:00:00Z").toLocaleString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"})),sub:`Operations by month · ${span}`}),
   "Hub-wise":()=>({cols:withFirst(opsCols,"Hub"),rows:agg(r=>hubName(r.hub),r=>hubName(r.hub)),sub:`Operations by hub · ${span}`}),
   "Zone-wise":()=>({cols:withFirst(opsCols,"Zone"),rows:agg(r=>zoneOfHub(r.hub),r=>zones.find(z=>z.id===zoneOfHub(r.hub)).name),sub:`Operations by zone · ${span}`}),
   "Department-wise":()=>({cols:wfCols("Department"),rows:wf(e=>e.dept),sub:`Workforce by department · joining / leaving since ${dmy(Z_FROM)}`}),
   "Employee-wise":()=>({cols:[["Employee","t"],["Employee ID","t"],["Hub","t"],["Department","t"],["Position","t"],["Status","t"],["Joined","t"],["Present","n"],["Late","n"],["Absent","n"],["Open tasks","n"],["Profile %","n"]],
      rows:es.map(e=>{const c={P:0,T:0,A:0,L:0,W:0};if(e.status==="Active")for(let d=1;d<=DAYS;d++)c[attCode(e.id,d)]++;const comp=zCompletion().find(x=>x.e.id===e.id);
        return [e.name,e.id,hubName(e.hub),e.dept,e.pos,e.status,dmy(e.join),c.P,c.T,c.A,tasks.filter(x=>!["Completed","Cancelled"].includes(x.status)&&x.title.includes(e.name)).length,comp?comp.pct:""]}),sub:"Employees · attendance 01/11/2026 – 10/11/2026"})};
  const r=(R[kind]||R["Weekly"])();return {...r,title:`XZM-TEAM · ${kind} report · ${scope}`,kind}}

function zTaskView(){const list=zTaskList().sort((a,b)=>a.deadline.localeCompare(b.deadline));const open=list.filter(x=>!["Completed","Cancelled"].includes(x.status));

function zCsv(text){const rows=[];let row=[],cur="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===","){row.push(cur);cur=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}

async function zReadSheet(file){const buf=new Uint8Array(await file.arrayBuffer());let rows;
  if(/\.csv$/i.test(file.name)||buf[0]!==0x50)rows=zCsv(new TextDecoder().decode(buf).replace(/^﻿/,""));
  else{const dv=new DataView(buf.buffer);let eo=buf.length-22;while(eo>=0&&dv.getUint32(eo,true)!==0x06054b50)eo--;if(eo<0)throw new Error("This is not a valid Excel (.xlsx) file.");
    const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const ent={};
    for(let i=0;i<n;i++){const nl=dv.getUint16(p+28,true);ent[new TextDecoder().decode(buf.subarray(p+46,p+46+nl))]={method:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true)}

      return new TextDecoder().decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer())};
    const xml=x=>new DOMParser().parseFromString(x,"application/xml");const ssx=await read("xl/sharedStrings.xml");
    const ss=ssx?[...xml(ssx).getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(x=>x.textContent).join("")):[];
    const sn=Object.keys(ent).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>a.length-b.length||a.localeCompare(b))[0];const sx=sn&&await read(sn);if(!sx)throw new Error("No worksheet was found in this file.");
    rows=[...xml(sx).getElementsByTagName("row")].map(r=>{const out=[];let ci=0;[...r.getElementsByTagName("c")].forEach(c=>{const ref=c.getAttribute("r");if(ref)ci=[...ref.replace(/\d+/g,"")].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;const ty=c.getAttribute("t"),v=c.getElementsByTagName("v")[0];

  return rows.map(r=>r.map(x=>String(x).trim())).filter(r=>r.some(x=>x!==""))}
const xfParseDate=v=>{v=String(v).trim();let m;if(/^\d{5}(\.\d+)?$/.test(v))return zAdd("1899-12-30",Math.floor(+v));if(/^\d{4}-\d\d-\d\d/.test(v))return v.slice(0,10);
  if((m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))){const iso=`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return zIso(new Date(iso+"T00:00:00Z"))===iso?iso:null}

function zImportPreview(file,rows){const f=xfCur();const norm=s=>String(s).toLowerCase().replace(/\s+/g," ").trim();const heads=f.cols.map(c=>norm(c[0]));
  let hi=-1,best=0;rows.slice(0,15).forEach((r,i)=>{const m=r.filter(x=>heads.includes(norm(x))).length;if(m>best){best=m;hi=i}});
  if(hi<0||best<Math.min(2,heads.length)){toast(`The headings in this file do not match the “${f.name}” format`);return}
  const idx={};rows[hi].forEach((h,i)=>{const c=f.cols.find(x=>norm(x[0])===norm(h));if(c&&c[1]!=="blank"&&idx[c[1]]===undefined)idx[c[1]]=i});const seen=new Set();

function zoneForm(z){const isNew=!z;z=z||{code:"",name:"",name_bn:"",mgr:"",phone:"",address:"",lang:"inherit",status:"active"};

   `<div class="grid2">${zField("zfc",L("Code *","কোড *"),inp("zfc",z.code,'maxlength="5" style="text-transform:uppercase"'))}${zField("zfs",L("Status","অবস্থা"),`<select id="zfs"><option value="active"${z.status==="active"?" selected":""}>${L("Active","সক্রিয়")}</option><option value="inactive"${z.status!=="active"?" selected":""}>${L("Inactive","নিষ্ক্রিয়")}</option></select>`)}
    ${zField("zfn",L("Name (English) *","নাম (ইংরেজি) *"),inp("zfn",z.name))}${zField("zfb",L("Name (Bangla)","নাম (বাংলা)")+(SYS.zo.bnRequired?" *":""),inp("zfb",z.name_bn))}
    ${zField("zfm",L("Zone manager","জোন ম্যানেজার"),inp("zfm",z.mgr))}${zField("zfp",L("Phone","ফোন"),inp("zfp",z.phone,'inputmode="tel"'))}</div>
    ${zField("zfa",L("Office address","অফিসের ঠিকানা"),inp("zfa",z.address))}
    ${zField("zfl",L("Language for this zone","এই জোনের ভাষা"),`<select id="zfl"><option value="inherit"${z.lang==="inherit"?" selected":""}>${L("System default","সিস্টেম ডিফল্ট")} (${SYS.lang==="bn"?"বাংলা":"English"})</option><option value="bn"${z.lang==="bn"?" selected":""}>বাংলা</option><option value="en"${z.lang==="en"?" selected":""}>English</option></select>`)}
    <p class="small muted" style="margin:0">${L("Everyone working in this zone (zone and hub managers, staff) sees the system in this language.","এই জোনে যারা কাজ করেন (জোন ও হাব ম্যানেজার, স্টাফ) সবাই এই ভাষায় সিস্টেম দেখবেন।")}</p>`,
   g=>{const code=g("zfc").value.trim().toUpperCase(),name=g("zfn").value.trim(),bn=g("zfb").value.trim();
    if(!/^[A-Z]{2,5}$/.test(code))return L("Code must be 2–5 letters (A–Z).","কোড ২–৫টি ইংরেজি অক্ষর হতে হবে।");
    if(zones.some(x=>x.code===code&&x!==z))return L("This code is already used by another zone.","এই কোড অন্য জোনে ব্যবহার হয়েছে।");
    if(!name)return L("Enter the English name.","ইংরেজি নাম লিখুন।");if(SYS.zo.bnRequired&&!bn)return L("Enter the Bangla name.","বাংলা নাম লিখুন।");

    if(isNew){const id="z"+Date.now().toString(36);zones.push({id,...v});log("CREATE","Zones",code,`zone “${name}” created`);toast(L("Zone created","জোন তৈরি হয়েছে"))}
    else{const ch=Object.keys(v).filter(k=>v[k]!==z[k]);Object.assign(z,v);log("UPDATE","Zones",code,ch.length?"changed: "+ch.join(", "):"no change");toast(L("Zone saved","জোন সেভ হয়েছে"))}
    zonesSave()},isNew?L("Create zone","জোন তৈরি"):L("Save","সেভ"))}

    confirmBox(L(`Delete zone ${z.name}?`,`${zoneLabel(z)} জোন মুছবেন?`),L("The zone is removed from lists. The audit log keeps the record of this action.","জোনটি তালিকা থেকে মুছে যাবে। অডিট লগে এই কাজের রেকর্ড থাকবে।"),true,r=>{zones.splice(zones.indexOf(z),1);zonesSave();log("DELETE","Zones",z.code,"reason: "+r);toast(L("Zone deleted","জোন মুছে ফেলা হয়েছে"));render()},L("Delete","মুছুন"))})};

const FDB=(()=>{let dbp=null;const mem={};
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("xzm_files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("f",mode);const out=fn(t.objectStore("f"));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)}));
  return {put:(k,v)=>tx("readwrite",s=>{s.put(v,k)}).catch(()=>{mem[k]=v}),get:k=>tx("readonly",s=>s.get(k)).then(v=>v===undefined?mem[k]:v).catch(()=>mem[k]),del:k=>tx("readwrite",s=>{s.delete(k)}).catch(()=>{delete mem[k]})}})();

  let used=rMonths(r.start.slice(0,7),from).length-1;let left=Math.max(0,(+r.advance||0)-used*(+r.adjust||0));
  return rMonths(from,last).map(mo=>{const adj=Math.min(+r.adjust||0,left);left-=adj;const charge=rMonthly(r)-adj;const paid=r.payments.filter(p=>p.month===mo).reduce((a,p)=>a+p.amount,0);return {mo,charge,adj,paid,due:Math.max(0,charge-paid)}})}

function zcCleanId(raw){let s=String(raw??"").trim().replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d));

  if(ZS.idRule.fixOcr&&/\d/.test(s))s=s.replace(/[Oo]/g,"0").replace(/[Il|]/g,"1").replace(/S/g,"5").replace(/B/g,"8");
  if(ZS.idRule.digitsOnly)s=s.replace(/\D/g,"");s=s.replace(/^0+(?=\d)/,"");return s}

/* ---- history: events with old → new, page visits ---- */
function daDiff(a,b){const out=[];if(!a||!b)return out;const lab={del:L("Delivery","ডেলিভারি"),pick:L("Pickup","পিকআপ"),amt:L("Amount","টাকা"),paid:L("Paid","জমা"),due:L("Due","বাকি"),mb:L("Mobile banking","মোবাইল ব্যাংকিং"),txn:L("Transaction ID","ট্রানজেকশন আইডি"),payId:L("Payment ID","পেমেন্ট আইডি"),name:L("Name","নাম"),ref:L("Reference","রেফারেন্স")};
  [["riders",L("Rider","রাইডার"),r=>`${r.emp} · ${r.name}`,["del","pick","amt","paid","due","mb"]],["pays",L("Merchant payment","মার্চেন্ট পেমেন্ট"),p=>p.payId||p.txn,["payId","txn","amt"]],["exps",L("Expense","খরচ"),x=>x.name,["name","ref","amt"]]].forEach(([k,what,nm,flds])=>{
   const A=a[k]||[],B=b[k]||[];B.forEach(y=>{const x=A.find(z=>z.n===y.n);if(!x){out.push([what+" · "+nm(y),L("added","যোগ"),"—",flds.includes("amt")?tk(y.amt):""]);return}flds.forEach(f=>{if(String(x[f]??"")!==String(y[f]??""))out.push([what+" · "+nm(y),lab[f]||f,x[f],y[f]])})});
   A.forEach(x=>{if(!B.find(z=>z.n===x.n))out.push([what+" · "+nm(x),L("removed","সরানো"),flds.includes("amt")?tk(x.amt):"","—"])})});return out}
function daHistTab(s){let prev=null;const items=s.events.map(ev=>{let diff=[];if(ev.snap){if(prev&&(ev.action==="resubmitted"))diff=daDiff(prev,ev.snap);prev=ev.snap}if(ev.action==="edit"&&ev.change)diff=[ev.change];return {ev,diff}}).reverse();
  const cls={approved:"ok",correction_required:"bad",reopened:"bad"};

   ${sec("dsR","cash",L("Due & mobile banking rules","বাকি ও মোবাইল ব্যাংকিং নিয়ম"),`${zField("dsDue",L("How is the due found?","বাকি কীভাবে হিসাব হবে?"),sel("dsDue",[["amount_minus_paid",L("Automatically: amount − paid","স্বয়ংক্রিয়: টাকা − জমা")],["manual",L("Typed by hand","হাতে লেখা")]],DS.dueRule))}
     ${zField("dsMb",L("Mobile banking","মোবাইল ব্যাংকিং"),sel("dsMb",[["separate",L("Kept separate (does not change the due)","আলাদা থাকবে (বাকি বদলাবে না)")],["reduces_due",L("Counts as paid (reduces the due)","জমা হিসেবে ধরা হবে (বাকি কমবে)")],["adds_to_due",L("Adds to the due","বাকিতে যোগ হবে")]],DS.mbRule))}`,L("Changing a rule affects new and edited lines only.","নিয়ম বদলালে শুধু নতুন ও সম্পাদিত লাইনে প্রভাব পড়বে।"))}
   ${sec("dsB","doc",L("Reference & bill upload","রেফারেন্স ও বিল আপলোড"),`<div class="grid2">${zField("dsPre",L("Reference prefix","রেফারেন্সের শুরু"),`<input id="dsPre" value="${esc(DS.refPrefix)}">`)}${zField("dsOver",L("Bill required from (৳)","কত টাকা থেকে বিল লাগবে (৳)"),`<input id="dsOver" type="number" min="0" value="${DS.billOver}">`)}${zField("dsMax",L("Largest file (MB)","সর্বোচ্চ ফাইল (MB)"),`<input id="dsMax" type="number" min="1" max="25" value="${DS.billMaxMb}">`)}</div>${sw("dsRefReq",L("Reference number is required","রেফারেন্স নম্বর আবশ্যক"),DS.refRequired)}`)}

   ${sec("dsC","receipt",L("Expense categories","খরচের ক্যাটাগরি"),`<div class="list">${DS.cats.map((c,i)=>`<div class="item" style="padding:8px 10px;align-items:center"><span>${esc(c.en)} · ${esc(c.bn)}${c.archived?` <span class="badge b-neutral">${L("hidden","লুকানো")}</span>`:""}</span><button type="button" class="btn sm" data-dscat="${i}">${c.archived?L("Show","দেখান"):L("Hide","লুকান")}</button></div>`).join("")}</div>
     <div class="grid2" style="margin-top:10px">${zField("dsCatEn",L("New category (English)","নতুন ক্যাটাগরি (ইংরেজি)"),`<input id="dsCatEn">`)}${zField("dsCatBn",L("New category (বাংলা)","নতুন ক্যাটাগরি (বাংলা)"),`<input id="dsCatBn">`)}</div>`,L("Categories are hidden, never deleted, so old expenses keep their category.","ক্যাটাগরি মুছে না, লুকানো হয় — পুরোনো খরচের ক্যাটাগরি ঠিক থাকে।"))}
   ${sec("dsT","form",L("Expense name, memo & OCR templates","খরচের নাম, মেমো ও OCR টেমপ্লেট"),`<div class="list">${DS.templates.map(t=>`<div class="item" style="padding:8px 10px;align-items:center"><span><b>${esc(t.name)}</b> · ${esc(daCat(t.cat))}${t.memo?` · ${esc(t.memo)}`:""}<span class="sec">${L("Words on the bill","বিলে যে শব্দ থাকলে")}: ${esc(t.kw||"—")}</span></span><button type="button" class="btn sm" data-dstpl="${t.n}">${t.archived?L("Show","দেখান"):L("Hide","লুকান")}</button></div>`).join("")}</div>
     <div class="grid2" style="margin-top:10px">${zField("dsTN",L("Expense name","খরচের নাম"),`<input id="dsTN">`)}${zField("dsTC",L("Category","ক্যাটাগরি"),sel("dsTC",DS.cats.filter(c=>!c.archived).map(c=>[c.code,L(c.en,c.bn)]),"transport"))}${zField("dsTM",L("Memo template","মেমো টেমপ্লেট"),`<input id="dsTM">`)}${zField("dsTK",L("Words on the bill (comma separated)","বিলের শব্দ (কমা দিয়ে)"),`<input id="dsTK" placeholder="cng, ভাড়া">`)}</div>`)}
   ${sec("dsA","users",L("Accounts Manager & hub-wise access","অ্যাকাউন্টস ম্যানেজার ও হাবভিত্তিক অ্যাক্সেস"),`${sw("dsReqA",L("Only the assigned Accounts Manager can verify a hub","শুধু নির্ধারিত অ্যাকাউন্টস ম্যানেজার হাব যাচাই করবেন"),DS.requireAssign)}
     <div class="tbl-wrap"><table><tbody><tr><th>${L("Hub","হাব")}</th><th>${L("Zone","জোন")}</th><th>${L("Accounts Manager","অ্যাকাউন্টস ম্যানেজার")}</th></tr>${hubs.map(h=>`<tr><td>${esc(h.name)}</td><td>${esc((zones.find(z=>z.id===h.zone)||{}).name||"")}</td><td><select data-dsacc="${h.id}" aria-label="${esc(h.name)}"><option value="">${L("— not assigned —","— নির্ধারিত নয় —")}</option>${users.map(x=>`<option${DS.accountants[h.id]===x?" selected":""}>${esc(x)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`,L("Each role only sees the hubs in its own area (zone or hub). The person who starts or submits a sheet can never verify it.","প্রতিটি রোল শুধু নিজের এলাকার (জোন বা হাব) হাব দেখে। যিনি খাতা শুরু বা সাবমিট করেন, তিনি কখনো যাচাই করতে পারবেন না।"))}
  </div>
  ${sec("dsP","shield",L("Who can do what","কে কী করতে পারবেন"),`<div class="tbl-wrap"><table><tbody><tr><th>${L("Role","রোল")}</th>${DA_ACTS.map(a=>`<th>${esc(L(a[1],a[2]))}</th>`).join("")}</tr>${R_ROLES.map(([r,n])=>`<tr><td><b>${esc(n)}</b></td>${DA_ACTS.map(a=>`<td><input type="checkbox" data-dsp="${r}|${a[0]}"${r==="super"||(DS.perm[r]||{})[a[0]]?" checked":""}${r==="super"?" disabled":""} aria-label="${esc(n+" "+a[1])}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>`,L("Staff and riders always see “My Accounts” for their own lines only.","স্টাফ ও রাইডার সবসময় শুধু নিজের লাইন “আমার হিসাব”-এ দেখেন।"))}`};
BIND.daset=()=>{const $=id=>document.getElementById(id);const f=(id,fn)=>{const el=$(id);if(el)el.onsubmit=e=>{e.preventDefault();const r=fn();if(r){toast(r);return}dsSave();daPermSync();log("CONFIGURE","Daily Accounts","settings",id);toast(L("Settings saved","সেটিংস সেভ হয়েছে"));render()}};
  f("dsG",()=>{DS.startTime=$("dsStart").value||"00:00";DS.backdate=Math.max(0,Math.min(31,+$("dsBack").value||0));DS.tracking=$("dsTrack").checked});
  f("dsF",()=>{["del","pick","mb","rem"].forEach(k=>DS.fields[k]=$("dsF_"+k).checked?1:0)});
  f("dsR",()=>{DS.dueRule=$("dsDue").value;DS.mbRule=$("dsMb").value});
  f("dsB",()=>{DS.refPrefix=$("dsPre").value.trim();DS.billOver=Math.max(0,+$("dsOver").value||0);DS.billMaxMb=Math.max(1,Math.min(25,+$("dsMax").value||10));DS.refRequired=$("dsRefReq").checked});
  f("dsO",()=>{DS.ocrOn=$("dsOcrOn").checked;DS.ocrLang=$("dsOcrL").value;DS.ocrConf=Math.max(0,Math.min(100,+$("dsOcrC").value||0));DS.ocrVerify=$("dsOcrV").checked});
  f("dsC",()=>{const en=$("dsCatEn").value.trim(),bn=$("dsCatBn").value.trim();if(!en&&!bn)return L("Type a category name","ক্যাটাগরির নাম লিখুন");const code=(en||bn).toLowerCase().replace(/[^a-z0-9]+/g,"_")||"c"+DS.cats.length;if(DS.cats.some(c=>c.code===code||c.en.toLowerCase()===en.toLowerCase()&&en))return L("This category already exists","এই ক্যাটাগরি আগেই আছে");DS.cats=[...DS.cats,{code,en:en||bn,bn:bn||en}]});
  f("dsT",()=>{const name=$("dsTN").value.trim();if(!name)return L("Type the expense name","খরচের নাম লিখুন");if(DS.templates.some(t=>t.name.toLowerCase()===name.toLowerCase()))return L("This template already exists","এই টেমপ্লেট আগেই আছে");DS.tplSeq=(DS.tplSeq||DS.templates.length)+1;DS.templates=[...DS.templates,{n:DS.tplSeq,name,cat:$("dsTC").value,memo:$("dsTM").value.trim(),kw:$("dsTK").value.trim()}]});
  f("dsA",()=>{DS.requireAssign=$("dsReqA").checked;document.querySelectorAll("[data-dsacc]").forEach(s=>{if(s.value)DS.accountants[s.dataset.dsacc]=s.value;else delete DS.accountants[s.dataset.dsacc]})});
  f("dsP",()=>{document.querySelectorAll("[data-dsp]").forEach(c=>{const [r,a]=c.dataset.dsp.split("|");if(r!=="super")(DS.perm[r]=DS.perm[r]||{})[a]=c.checked?1:0})});
  document.querySelectorAll("[data-dscat]").forEach(b=>b.onclick=()=>{const c=DS.cats[+b.dataset.dscat];c.archived=!c.archived;dsSave();log("CONFIGURE","Daily Accounts","category",`${c.en} ${c.archived?"hidden":"shown"}`);render()});
  document.querySelectorAll("[data-dstpl]").forEach(b=>b.onclick=()=>{const t=DS.templates.find(x=>x.n===+b.dataset.dstpl);t.archived=!t.archived;dsSave();log("CONFIGURE","Daily Accounts","template",`${t.name} ${t.archived?"hidden":"shown"}`);render()})};

function daPermSync(){Object.keys(perms).forEach(r=>{const d=Object.getOwnPropertyDescriptor(perms,r);if(!d||d.get)return;const p=perms[r];const can=a=>r==="super"||!!((DS.perm[r]||{})[a]);
  [["dacct",can("view")||can("create")||can("approve")||can("correct")],["damy",true],["darep",can("report")],["daset",can("settings")]].forEach(([s,ok])=>{const i=p.indexOf(s);if(ok&&i<0)p.push(s);if(!ok&&i>=0)p.splice(i,1)})})}
{const g=NAV.find(x=>x[0]==="g_accm")[1];g.unshift("dacct","damy","darep","daset");
 Object.assign(NAVICON,{dacct:"ledger",damy:"wallet",darep:"chart",daset:"gear"});APP_SCREENS.push("dacct","damy","darep","daset");
 Object.assign(T.en,{dacct:"Daily Accounts",damy:"My Accounts",darep:"Accounts Reports",daset:"Accounts Settings"});Object.assign(T.bn,{dacct:"আজকের হিসাব খাতা",damy:"আমার হিসাব",darep:"হিসাবের রিপোর্ট",daset:"হিসাব সেটিংস"});
